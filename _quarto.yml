project:
  type: book
  output-dir: docs

book:
  title: "Multiple imputation-propensity score workflows"
  subtitle: "Examples for multiple imputation and propensity score workflows"
  author: "Janick Weberpals, RPh, PhD"
  date: last-modified
  description: |
    Miscellaneous multiple imputation and propensity score workflows

  chapters:
    # landing page
    - index.qmd
    - chapters/background.qmd
    - chapters/syvcox_coxph.qmd
    - chapters/raking_weights.qmd
    - chapters/km_pooling.qmd
    - chapters/agreement_metrics.qmd

  reader-mode: true
  repo-url: https://github.com/janickweberpals/imputation-ps-workflows
  repo-actions: [issue]

format:
  html:
    theme: journal
    code-fold: false
    code-summary: "Show the code"
    code-tools: true
    engine: knitr
    page-layout: full
    link-external-icon: true
    link-external-newwindow: true
    format: html
    toc: true
    toc-depth: 3
    embed-resources: true
    bibliography: references.bib
    csl: pharmacoepidemiology-and-drug-safety.csl

